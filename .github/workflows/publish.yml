name: Publish to NPM

# `published` fires once, when the release becomes public. `created` also
# fired for drafts, and never again when the draft was published.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          # No dependency cache: in a release workflow a poisoned cache ends up in the package.

      - name: Install dependencies
        # No lifecycle scripts. The only dependencies with one (@parcel/watcher
        # and unrs-resolver, both dev) ship prebuilt binaries as optional
        # dependencies; build and tests do not need their scripts.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check package contents
        # Fails if coverage reports, tests or .ts sources (other than .d.ts) would be published.
        run: npm run check:pack

      - name: Pack
        run: |
          mkdir pack
          npm pack --ignore-scripts --pack-destination pack
          sha256sum pack/*.tgz

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (and, later, trusted publishing)
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: pack

      - name: Publish the tested tarball 📦
        run: |
          # The ./ matters: npm reads "pack/x.tgz" as the GitHub repository "pack/x.tgz".
          set -- ./pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one tarball in pack/, found: $*" >&2
            exit 1
          fi
          sha256sum "$1"
          npm publish "$1" --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
